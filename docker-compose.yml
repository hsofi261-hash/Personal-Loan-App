version: '3.8'

services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Node.js Server ---
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: node_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Use container name 'postgres' as host inside Docker network
      DATABASE_URL: postgres://postgres:mysecretpassword@postgres:5432/mydatabase
    volumes:               
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

# --- Persistent Volumes & Networks ---
volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge